<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BarberPro" />
  <title>BarberPro - Gestor do Barbeiro</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              darkgold: '#AA820A',
              bg: '#121214',
              surface: '#1A1A1E',
              card: '#222227',
              border: '#2E2E36',
              accent: '#E5C07B'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cinzel"', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #121214;
      color: #F3F4F6;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, textarea {
      user-select: text;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="font-sans antialiased pb-24">

  <!-- TOPO / CABEÇALHO -->
  <header class="sticky top-0 z-40 bg-brand-surface/90 backdrop-blur-md border-b border-brand-border px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-gold to-brand-darkgold flex items-center justify-center text-black font-bold shadow-lg shadow-brand-gold/10">
        <i class="ph-bold ph-scissors text-xl"></i>
      </div>
      <div>
        <h1 class="font-serif font-bold text-lg leading-tight tracking-wider text-brand-gold">BARBERPRO</h1>
        <p class="text-[10px] text-zinc-400 uppercase tracking-widest">Painel do Barbeiro</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="abrirModalAgendamento()" class="px-3 py-1.5 rounded-lg bg-brand-gold text-black font-bold text-xs flex items-center gap-1 active:scale-95 transition shadow-sm">
        <i class="ph-bold ph-plus"></i> Novo
      </button>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL (TELAS) -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- ABA 1: AGENDA -->
    <section id="aba-agenda" class="space-y-4">
      <!-- Filtro de Data -->
      <div class="bg-brand-surface border border-brand-border p-3 rounded-2xl flex items-center justify-between gap-3 shadow-sm">
        <div class="flex items-center gap-2 text-zinc-300">
          <i class="ph-bold ph-calendar text-brand-gold text-lg"></i>
          <input type="date" id="filtro-data" onchange="renderizarAgenda()" class="bg-brand-card border border-brand-border rounded-lg px-2.5 py-1 text-sm font-semibold text-white focus:outline-none focus:border-brand-gold">
        </div>
        <div class="flex gap-1.5">
          <button onclick="definirDataHoje()" class="px-2.5 py-1 text-xs rounded-lg bg-brand-card border border-brand-border text-zinc-300 active:bg-brand-border">Hoje</button>
          <button onclick="definirDataAmanha()" class="px-2.5 py-1 text-xs rounded-lg bg-brand-card border border-brand-border text-zinc-300 active:bg-brand-border">Amanhã</button>
        </div>
      </div>

      <!-- Métricas do Dia -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-brand-surface border border-brand-border p-3.5 rounded-2xl shadow-sm">
          <div class="flex items-center gap-2 text-zinc-400 text-xs mb-1">
            <i class="ph-bold ph-clock text-brand-gold"></i>
            <span>Horários Marcados</span>
          </div>
          <div id="metricas-qtd" class="text-xl font-bold text-white">0</div>
        </div>
        <div class="bg-brand-surface border border-brand-border p-3.5 rounded-2xl shadow-sm">
          <div class="flex items-center gap-2 text-zinc-400 text-xs mb-1">
            <i class="ph-bold ph-currency-circle-dollar text-emerald-400"></i>
            <span>Estimado do Dia</span>
          </div>
          <div id="metricas-valor" class="text-xl font-bold text-emerald-400">R$ 0,00</div>
        </div>
      </div>

      <!-- Lista de Agendamentos -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Compromissos</h2>
          <span id="badge-total" class="text-[11px] text-zinc-500 font-medium">0 horários</span>
        </div>
        <div id="lista-agendamentos" class="space-y-2.5">
          <!-- Renderizado via JS -->
        </div>
      </div>
    </section>

    <!-- ABA 2: CLIENTES -->
    <section id="aba-clientes" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-base text-white">Meus Clientes</h2>
        <div class="flex gap-2">
          <!-- Botão para puxar da agenda do celular -->
          <button onclick="puxarContatoCelular()" class="px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-brand-gold font-semibold text-xs flex items-center gap-1 active:scale-95 transition">
            <i class="ph-bold ph-device-mobile"></i> 📱 Puxar da Agenda
          </button>
          <button onclick="abrirModalCliente()" class="px-3 py-1.5 rounded-lg bg-brand-gold text-black font-bold text-xs flex items-center gap-1 active:scale-95 transition">
            <i class="ph-bold ph-user-plus"></i> Novo
          </button>
        </div>
      </div>

      <!-- Barra de Pesquisa -->
      <div class="relative">
        <i class="ph-bold ph-magnifying-glass absolute left-3 top-3 text-zinc-400"></i>
        <input type="text" id="busca-cliente" oninput="renderizarClientes()" placeholder="Buscar por nome ou WhatsApp..." class="w-full bg-brand-surface border border-brand-border rounded-xl pl-9 pr-3 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-brand-gold">
      </div>

      <!-- Lista de Clientes -->
      <div id="lista-clientes" class="space-y-2">
        <!-- Renderizado via JS -->
      </div>
    </section>

    <!-- ABA 3: SERVIÇOS E CONFIGURAÇÕES -->
    <section id="aba-config" class="hidden space-y-5">
      <div>
        <h2 class="font-bold text-base text-white mb-2">Serviços Cadastrados</h2>
        <div id="lista-servicos" class="space-y-2">
          <!-- Renderizado via JS -->
        </div>
        <button onclick="abrirModalServico()" class="mt-3 w-full py-2 rounded-xl bg-brand-surface border border-brand-border text-brand-gold font-semibold text-xs flex items-center justify-center gap-1.5 active:bg-brand-card transition">
          <i class="ph-bold ph-plus"></i> Adicionar Outro Serviço
        </button>
      </div>

      <div class="bg-brand-surface border border-brand-border p-4 rounded-2xl space-y-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i class="ph-bold ph-gear text-brand-gold"></i> Opções do Aplicativo
        </h3>
        <p class="text-xs text-zinc-400">Você pode limpar todos os dados cadastrados no aparelho para testes.</p>
        <button onclick="zerarAplicativo()" class="w-full py-2 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 font-bold text-xs flex items-center justify-center gap-1.5 active:bg-rose-500/20 transition">
          <i class="ph-bold ph-trash"></i> Zerar Todos os Dados
        </button>
      </div>
    </section>

  </main>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
  <nav class="fixed bottom-0 inset-x-0 bg-brand-surface/95 backdrop-blur-md border-t border-brand-border z-40 py-1.5 px-6 max-w-md mx-auto">
    <div class="flex items-center justify-between">
      <button onclick="trocarAba('agenda')" id="tab-agenda" class="flex flex-col items-center gap-0.5 text-brand-gold transition">
        <i class="ph-fill ph-calendar text-2xl"></i>
        <span class="text-[10px] font-bold">Agenda</span>
      </button>
      <button onclick="trocarAba('clientes')" id="tab-clientes" class="flex flex-col items-center gap-0.5 text-zinc-500 transition">
        <i class="ph-bold ph-users text-2xl"></i>
        <span class="text-[10px] font-bold">Clientes</span>
      </button>
      <button onclick="trocarAba('config')" id="tab-config" class="flex flex-col items-center gap-0.5 text-zinc-500 transition">
        <i class="ph-bold ph-sliders text-2xl"></i>
        <span class="text-[10px] font-bold">Serviços</span>
      </button>
    </div>
  </nav>

  <!-- MODAL: NOVO AGENDAMENTO -->
  <div id="modal-agendamento" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-brand-surface border-t sm:border border-brand-border w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i class="ph-bold ph-calendar-plus text-brand-gold"></i> Novo Agendamento
        </h3>
        <button onclick="fecharModalAgendamento()" class="text-zinc-400 hover:text-white p-1 text-lg">✕</button>
      </div>

      <!-- Botão para puxar direto do celular no agendamento -->
      <button onclick="puxarContatoParaAgendamento()" type="button" class="w-full py-2 px-3 rounded-xl bg-brand-card border border-brand-border text-brand-gold text-xs font-bold flex items-center justify-center gap-2 active:bg-brand-border">
        <i class="ph-bold ph-device-mobile text-base"></i> 📱 Selecionar Contato da Agenda do Celular
      </button>

      <form id="form-agendamento" onsubmit="salvarAgendamento(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Nome do Cliente *</label>
          <input type="text" id="ag-nome" required placeholder="Ex: Roberto Silva" class="w-full bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-gold">
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">WhatsApp (DDD + Número) *</label>
          <input type="tel" id="ag-telefone" required placeholder="Ex: 31988887777" class="w-full bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-gold">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Data *</label>
            <input type="date" id="ag-data" required class="w-full bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-gold">
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Horário *</label>
            <input type="time" id="ag-hora" required class="w-full bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-gold">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Serviço *</label>
          <select id="ag-servico" required class="w-full bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-gold">
            <!-- Opções via JS -->
          </select>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="fecharModalAgendamento()" class="flex-1 py-2.5 rounded-xl bg-brand-card border border-brand-border text-zinc-300 text-xs font-bold active:bg-brand-border">Cancelar</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-brand-gold text-black text-xs font-bold active:scale-95 transition">Salvar Agendamento</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: NOVO CLIENTE -->
  <div id="modal-cliente" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-brand-surface border-t sm:border border-brand-border w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i class="ph-bold ph-user-plus text-brand-gold"></i> Cadastrar Cliente
        </h3>
        <button onclick="fecharModalCliente()" class="text-zinc-400 hover:text-white p-1 text-lg">✕</button>
      </div>

      <form id="form-cliente" onsubmit="salvarClienteManual(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Nome Completo *</label>
          <input type="text" id="cli-nome" required placeholder="Ex: Carlos Mendes" class="w-full bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-gold">
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">WhatsApp (DDD + Número) *</label>
          <input type="tel" id="cli-telefone" required placeholder="Ex: 31999998888" class="w-full bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-gold">
        </div>
        <div class="pt-2 flex gap-2">
          <button type="button" onclick="fecharModalCliente()" class="flex-1 py-2.5 rounded-xl bg-brand-card border border-brand-border text-zinc-300 text-xs font-bold">Cancelar</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-brand-gold text-black text-xs font-bold">Adicionar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT DA APLICAÇÃO -->
  <script>
    // LISTA DE SERVIÇOS BASE
    const servicosPadrao = [
      { id: '1', nome: 'Corte Tradicional / Social', preco: 35.00 },
      { id: '2', nome: 'Corte Degradê / Fade', preco: 40.00 },
      { id: '3', nome: 'Barba Completa com Toalha', preco: 30.00 },
      { id: '4', nome: 'Combo: Corte + Barba', preco: 65.00 },
      { id: '5', nome: 'Pezinho / Acabamento', preco: 15.00 }
    ];

    // ESTADO LOCAL (INICIA TOTALMENTE ZERADO)
    let agendamentos = JSON.parse(localStorage.getItem('barber_agendamentos')) || [];
    let clientes = JSON.parse(localStorage.getItem('barber_clientes')) || [];
    let servicos = JSON.parse(localStorage.getItem('barber_servicos')) || servicosPadrao;

    function salvarTudo() {
      localStorage.setItem('barber_agendamentos', JSON.stringify(agendamentos));
      localStorage.setItem('barber_clientes', JSON.stringify(clientes));
      localStorage.setItem('barber_servicos', JSON.stringify(servicos));
    }

    // NAVEGAÇÃO DE ABAS
    function trocarAba(aba) {
      document.getElementById('aba-agenda').classList.add('hidden');
      document.getElementById('aba-clientes').classList.add('hidden');
      document.getElementById('aba-config').classList.add('hidden');

      document.getElementById('tab-agenda').className = "flex flex-col items-center gap-0.5 text-zinc-500 transition";
      document.getElementById('tab-clientes').className = "flex flex-col items-center gap-0.5 text-zinc-500 transition";
      document.getElementById('tab-config').className = "flex flex-col items-center gap-0.5 text-zinc-500 transition";

      if (aba === 'agenda') {
        document.getElementById('aba-agenda').classList.remove('hidden');
        document.getElementById('tab-agenda').className = "flex flex-col items-center gap-0.5 text-brand-gold transition";
        renderizarAgenda();
      } else if (aba === 'clientes') {
        document.getElementById('aba-clientes').classList.remove('hidden');
        document.getElementById('tab-clientes').className = "flex flex-col items-center gap-0.5 text-brand-gold transition";
        renderizarClientes();
      } else if (aba === 'config') {
        document.getElementById('aba-config').classList.remove('hidden');
        document.getElementById('tab-config').className = "flex flex-col items-center gap-0.5 text-brand-gold transition";
        renderizarServicos();
      }
    }

    // CONTACT PICKER API (PUXAR DIRETO DO CELULAR)
    async function puxarContatoCelular() {
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const props = ['name', 'tel'];
          const opts = { multiple: true };
          const contatosSelecionados = await navigator.contacts.select(props, opts);

          if (contatosSelecionados && contatosSelecionados.length > 0) {
            let adicionados = 0;
            contatosSelecionados.forEach(c => {
              const nome = c.name ? c.name[0] : 'Cliente';
              const telRaw = c.tel ? c.tel[0] : '';
              const telLimpo = telRaw.replace(/\D/g, '');

              if (telLimpo) {
                const jaExiste = clientes.some(cli => cli.telefone.replace(/\D/g, '') === telLimpo);
                if (!jaExiste) {
                  clientes.push({ id: Date.now().toString() + Math.random(), nome: nome, telefone: telLimpo });
                  adicionados++;
                }
              }
            });
            salvarTudo();
            renderizarClientes();
            alert(`${adicionados} contato(s) importado(s) com sucesso da sua agenda!`);
          }
        } catch (ex) {
          console.log('Seleção de contatos cancelada ou não permitida.', ex);
        }
      } else {
        alert('O seu aparelho não suporta a importação automática direta. Você pode cadastrar manualmente pelo botão "Novo".');
      }
    }

    // PUXAR CONTATO PARA PREENCHER O AGENDAMENTO
    async function puxarContatoParaAgendamento() {
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const props = ['name', 'tel'];
          const contatos = await navigator.contacts.select(props, { multiple: false });
          if (contatos && contatos.length > 0) {
            const c = contatos[0];
            if (c.name && c.name[0]) document.getElementById('ag-nome').value = c.name[0];
            if (c.tel && c.tel[0]) document.getElementById('ag-telefone').value = c.tel[0].replace(/\D/g, '');
          }
        } catch (e) {
          console.log(e);
        }
      } else {
        alert('Recurso suportado no Google Chrome no Android. Se não abrir, digite o nome e telefone manualmente.');
      }
    }

    // DATA HOJE / AMANHÃ
    function obterDataHojeString() {
      const d = new Date();
      const ano = d.getFullYear();
      const mes = String(d.getMonth() + 1).padStart(2, '0');
      const dia = String(d.getDate()).padStart(2, '0');
      return `${ano}-${mes}-${dia}`;
    }

    function definirDataHoje() {
      document.getElementById('filtro-data').value = obterDataHojeString();
      renderizarAgenda();
    }

    function definirDataAmanha() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      const ano = d.getFullYear();
      const mes = String(d.getMonth() + 1).padStart(2, '0');
      const dia = String(d.getDate()).padStart(2, '0');
      document.getElementById('filtro-data').value = `${ano}-${mes}-${dia}`;
      renderizarAgenda();
    }

    // RENDERIZAR AGENDA
    function renderizarAgenda() {
      const dataFiltro = document.getElementById('filtro-data').value || obterDataHojeString();
      const listaEl = document.getElementById('lista-agendamentos');
      
      const filtrados = agendamentos.filter(a => a.data === dataFiltro).sort((a,b) => a.hora.localeCompare(b.hora));
      
      // Métricas
      document.getElementById('metricas-qtd').innerText = `${filtrados.length} horários`;
      const totalValor = filtrados.reduce((acc, curr) => acc + (parseFloat(curr.preco) || 0), 0);
      document.getElementById('metricas-valor').innerText = `R$ ${totalValor.toFixed(2).replace('.', ',')}`;
      document.getElementById('badge-total').innerText = `${filtrados.length} no dia`;

      if (filtrados.length === 0) {
        listaEl.innerHTML = `
          <div class="bg-brand-surface border border-brand-border rounded-2xl p-8 text-center space-y-2">
            <i class="ph-bold ph-calendar-blank text-4xl text-zinc-600 mx-auto"></i>
            <p class="text-sm font-semibold text-zinc-300">Nenhum horário marcado</p>
            <p class="text-xs text-zinc-500">Toque em "+ Novo" no topo para adicionar o primeiro cliente.</p>
          </div>
        `;
        return;
      }

      listaEl.innerHTML = filtrados.map(a => {
        const telLimpo = a.telefone.replace(/\D/g, '');
        const msgWhats = encodeURIComponent(`Olá ${a.nome}! Confirmando seu horário aqui na barbearia para ${formatarDataBR(a.data)} às ${a.hora} (${a.servico}). Qualquer dúvida me avise!`);
        const linkWhats = `https://wa.me/55${telLimpo}?text=${msgWhats}`;

        return `
          <div class="bg-brand-surface border border-brand-border p-3.5 rounded-2xl flex items-center justify-between gap-3 shadow-sm">
            <div class="flex items-center gap-3">
              <div class="w-12 text-center">
                <span class="text-sm font-bold text-brand-gold">${a.hora}</span>
              </div>
              <div class="border-l border-brand-border pl-3">
                <h4 class="font-bold text-white text-sm leading-tight">${a.nome}</h4>
                <p class="text-xs text-zinc-400">${a.servico} • <span class="text-emerald-400 font-semibold">R$ ${parseFloat(a.preco).toFixed(2).replace('.', ',')}</span></p>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <a href="${linkWhats}" target="_blank" class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg active:scale-95 transition" title="Enviar WhatsApp">
                <i class="ph-bold ph-whatsapp-logo"></i>
              </a>
              <button onclick="excluirAgendamento('${a.id}')" class="w-8 h-8 rounded-xl bg-brand-card border border-brand-border text-zinc-400 hover:text-rose-400 flex items-center justify-center text-base active:scale-95 transition" title="Excluir">
                <i class="ph-bold ph-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatarDataBR(dataISO) {
      if (!dataISO) return '';
      const [ano, mes, dia] = dataISO.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    // MODAL DE AGENDAMENTO
    function abrirModalAgendamento() {
      popularSelectServicos();
      document.getElementById('ag-data').value = document.getElementById('filtro-data').value || obterDataHojeString();
      document.getElementById('modal-agendamento').classList.remove('hidden');
    }

    function fecharModalAgendamento() {
      document.getElementById('modal-agendamento').classList.add('hidden');
      document.getElementById('form-agendamento').reset();
    }

    function popularSelectServicos() {
      const select = document.getElementById('ag-servico');
      select.innerHTML = servicos.map(s => `
        <option value="${s.nome}" data-preco="${s.preco}">${s.nome} - R$ ${parseFloat(s.preco).toFixed(2).replace('.', ',')}</option>
      `).join('');
    }

    function salvarAgendamento(e) {
      e.preventDefault();
      const nome = document.getElementById('ag-nome').value.trim();
      const telefone = document.getElementById('ag-telefone').value.trim();
      const data = document.getElementById('ag-data').value;
      const hora = document.getElementById('ag-hora').value;
      const selectServico = document.getElementById('ag-servico');
      const servicoNome = selectServico.value;
      const preco = selectServico.selectedOptions[0].getAttribute('data-preco');

      const novoAgendamento = {
        id: Date.now().toString(),
        nome,
        telefone,
        data,
        hora,
        servico: servicoNome,
        preco: parseFloat(preco)
      };

      agendamentos.push(novoAgendamento);

      // Salva cliente se não existir
      const jaExisteCliente = clientes.some(c => c.telefone.replace(/\D/g, '') === telefone.replace(/\D/g, ''));
      if (!jaExisteCliente) {
        clientes.push({ id: Date.now().toString() + 'c', nome, telefone });
      }

      salvarTudo();
      fecharModalAgendamento();
      renderizarAgenda();
    }

    function excluirAgendamento(id) {
      if (confirm('Deseja excluir este agendamento?')) {
        agendamentos = agendamentos.filter(a => a.id !== id);
        salvarTudo();
        renderizarAgenda();
      }
    }

    // CLIENTES
    function renderizarClientes() {
      const termo = document.getElementById('busca-cliente').value.toLowerCase();
      const listaEl = document.getElementById('lista-clientes');

      const filtrados = clientes.filter(c => 
        c.nome.toLowerCase().includes(termo) || c.telefone.includes(termo)
      );

      if (filtrados.length === 0) {
        listaEl.innerHTML = `
          <div class="bg-brand-surface border border-brand-border rounded-2xl p-6 text-center text-xs text-zinc-500">
            Nenhum cliente cadastrado ainda. Puxe da agenda do celular ou clique em "Novo".
          </div>
        `;
        return;
      }

      listaEl.innerHTML = filtrados.map(c => {
        const telLimpo = c.telefone.replace(/\D/g, '');
        return `
          <div class="bg-brand-surface border border-brand-border p-3 rounded-2xl flex items-center justify-between shadow-sm">
            <div>
              <h4 class="font-bold text-white text-sm">${c.nome}</h4>
              <p class="text-xs text-zinc-400">${c.telefone}</p>
            </div>
            <div class="flex items-center gap-1.5">
              <a href="https://wa.me/55${telLimpo}" target="_blank" class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-base">
                <i class="ph-bold ph-whatsapp-logo"></i>
              </a>
              <button onclick="excluirCliente('${c.id}')" class="w-8 h-8 rounded-xl bg-brand-card border border-brand-border text-zinc-400 hover:text-rose-400 flex items-center justify-center text-base">
                <i class="ph-bold ph-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function abrirModalCliente() {
      document.getElementById('modal-cliente').classList.remove('hidden');
    }

    function fecharModalCliente() {
      document.getElementById('modal-cliente').classList.add('hidden');
      document.getElementById('form-cliente').reset();
    }

    function salvarClienteManual(e) {
      e.preventDefault();
      const nome = document.getElementById('cli-nome').value.trim();
      const telefone = document.getElementById('cli-telefone').value.trim();

      clientes.push({ id: Date.now().toString(), nome, telefone });
      salvarTudo();
      fecharModalCliente();
      renderizarClientes();
    }

    function excluirCliente(id) {
      if (confirm('Remover cliente da lista?')) {
        clientes = clientes.filter(c => c.id !== id);
        salvarTudo();
        renderizarClientes();
      }
    }

    // SERVIÇOS
    function renderizarServicos() {
      const listaEl = document.getElementById('lista-servicos');
      listaEl.innerHTML = servicos.map(s => `
        <div class="bg-brand-surface border border-brand-border p-3 rounded-xl flex items-center justify-between text-xs">
          <span class="font-bold text-white">${s.nome}</span>
          <span class="text-brand-gold font-semibold">R$ ${parseFloat(s.preco).toFixed(2).replace('.', ',')}</span>
        </div>
      `).join('');
    }

    function abrirModalServico() {
      const nome = prompt('Nome do novo serviço:');
      if (!nome) return;
      const precoStr = prompt('Preço (ex: 35.00):');
      const preco = parseFloat(precoStr);
      if (isNaN(preco)) {
        alert('Preço inválido.');
        return;
      }
      servicos.push({ id: Date.now().toString(), nome, preco });
      salvarTudo();
      renderizarServicos();
    }

    // ZERAR APLICATIVO COMPLETO
    function zerarAplicativo() {
      if (confirm('Tem certeza de que deseja apagar todos os horários e clientes e começar do zero?')) {
        localStorage.clear();
        agendamentos = [];
        clientes = [];
        servicos = servicosPadrao;
        salvarTudo();
        renderizarAgenda();
        alert('Aplicativo 100% zerado e pronto para o trabalho!');
      }
    }

    // INICIALIZAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
      definirDataHoje();
    });
  </script>
</body>
</html>
